armie_game:
  ros__parameters:
    motion_backend: mock
    motion_enabled: false
    front_pose_json: '[]'
    table_pose_json: '[]'
    calibration_file: /workspaces/zephyr-dev/zephyr_ws/armie_calibration.json
    mock_step_sec: 0.3
    face_duration_sec: 18.0
    ball_duration_sec: 25.0
    # Confirm camera orientation on this wrist before enabling direct servo.
    servo_commissioned: false
    yaw_direction: -1.0
    pitch_direction: -1.0
    # Normalized image coordinates at the recorded TABLE pose, not during pan.
    dock_roi_json: '[-0.2,-0.2,0.2,0.2]'
    grasp_enabled: false
    # Three commissioned poses: pregrasp, grasp, small lift. Never use guessed values.
    grasp_path_json: '[]'
    gripper_enabled: false
    gripper_action: /rebot_arm_rs_gripper_controller/gripper_cmd
    gripper_joint: gripper_command_joint
    trajectory_action: /rebot_arm_rs_impedance_trajectory_controller/follow_joint_trajectory
    controller_manager: /controller_manager
    required_guard_node: /rebot_arm_rs_impedance_trajectory_guard
armie_senses:
  ros__parameters:
    senses_backend: mock
    image_topic: /camera/color/image_raw/compressed
    gesture_model_path: /workspaces/zephyr-dev/zephyr_ws/.armie-runtime/models/gesture_recognizer.task
    ball_hsv_low: [5, 100, 80]
    ball_hsv_high: [30, 255, 255]
